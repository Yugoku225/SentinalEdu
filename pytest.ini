[pytest]
testpaths = tests
markers =
    live: calls the real Gemini API (needs GEMINI_API_KEY); run with -m live
    legacy: runs the original evaluator (loads TrOCR/SBERT/DistilBERT models; slow)
addopts = -m "not live and not legacy"
filterwarnings =
    ignore:PyPDF2 is deprecated:DeprecationWarning
